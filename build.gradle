plugins { id 'java' }
group = 'com.wintertodtautopilot'
version = '0.1.0'
repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = '1.13.1'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wintertodtautopilot.WintertodtAutopilotLauncher'
    jvmArgs '-ea'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED'
        jvmArgs '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
    }
    args '--developer-mode', '--debug'
}

tasks.named('jar') {
    from(files('LICENSE', 'THIRD_PARTY_NOTICES')) { into 'META-INF' }
}

tasks.register('previewOverlay', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wintertodtautopilot.WintertodtOverlayPreview'
    jvmArgs '-Djava.awt.headless=true'
}
